<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hitmigo - Безплатни обяви</title>
  <style>
    body {margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#14213d}
    header {background:#0754c9;color:white;padding:25px;text-align:center}
    h1 {margin:0;font-size:36px}
    .hero {padding:35px 18px;text-align:center}
    input {padding:14px;width:80%;max-width:400px;border:1px solid #ccc;border-radius:9px}
    button {padding:14px 20px;background:#00aa65;color:white;border:0;border-radius:9px;margin:10px}
    .categories {display:flex;flex-wrap:wrap;justify-content:center;gap:12px;padding:15px}
    .category {background:white;padding:20px;border-radius:12px;box-shadow:0 2px 8px #ddd}
  </style>
</head>
<body>
  <header>
    <h1>Hitmigo</h1>
    <p>Публикувай безплатно. Намери всичко.</p>
  </header>
  <main>
    <section class="hero">
      <h2>Безплатни обяви в България</h2>
      <input placeholder="Какво търсиш?">
      <button>Търси</button>
    </section>
    <section class="categories">
      <div class="category">🚗 Автомобили</div>
      <div class="category">🏠 Имоти</div>
      <div class="category">📱 Техника</div>
      <div class="category">👕 Мода</div>
      <div class="category">🛋️ За дома</div>
      <div class="category">💼 Работа</div>
      <div class="category">🔧 Услуги</div>
    </section>
  </main>


<section id="hitmigo-account" style="padding:25px 18px;text-align:center;background:#eef5ff">
  <h2>👤 Моят профил</h2>
  <div id="auth-form">
    <input id="auth-email" type="email" placeholder="Имейл" autocomplete="email">
    <br><br>
    <input id="auth-password" type="password" placeholder="Парола (поне 6 символа)" autocomplete="current-password">
    <br><br>
    <button type="button" onclick="hitmigoRegister()">Регистрация</button>
    <button type="button" onclick="hitmigoLogin()">Вход</button>
  </div>
  <div id="auth-user" style="display:none">
    <p id="auth-status"></p>
    <button type="button" onclick="hitmigoLogout()">Изход</button>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="hitmigo-auth.js"></script>
<script>
  function hitmigoCredentials() {
    return [
      document.getElementById("auth-email").value.trim(),
      document.getElementById("auth-password").value
    ];
  }

  async function hitmigoRegister() {
    const [email, password] = hitmigoCredentials();
    if (!email || password.length < 6) {
      alert("Въведи имейл и парола с поне 6 символа.");
      return;
    }
    await registerUser(email, password);
    await hitmigoRefresh();
  }

  async function hitmigoLogin() {
    const [email, password] = hitmigoCredentials();
    if (!email || !password) {
      alert("Въведи имейл и парола.");
      return;
    }
    await loginUser(email, password);
    await hitmigoRefresh();
  }

  async function hitmigoLogout() {
    await logoutUser();
    await hitmigoRefresh();
  }

  async function hitmigoRefresh() {
    const { data, error } = await db.auth.getUser();
    if (error && error.name !== "AuthSessionMissingError") {
      console.warn(error.message);
    }
    const user = data?.user;
    document.getElementById("auth-form").style.display =
      user ? "none" : "block";
    document.getElementById("auth-user").style.display =
      user ? "block" : "none";
    document.getElementById("auth-status").textContent =
      user ? "Влязъл си като: " + user.email : "";
  }

  hitmigoRefresh();
</script>
</body>

</html>
