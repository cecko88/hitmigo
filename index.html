<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hitmigo - Безплатни обяви</title>
  <style>
    body {margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#14213d}
    header {background:#0754c9;color:white;padding:25px;text-align:center}
    h1 {margin:0;font-size:36px}
    .hero {padding:35px 18px;text-align:center}
    input {padding:14px;width:80%;max-width:400px;border:1px solid #ccc;border-radius:9px}
    button {padding:14px 20px;background:#00aa65;color:white;border:0;border-radius:9px;margin:10px}
    .categories {display:flex;flex-wrap:wrap;justify-content:center;gap:12px;padding:15px}
    .category {background:white;padding:20px;border-radius:12px;box-shadow:0 2px 8px #ddd}
  </style>
</head>
<body>
  <header>
    <h1>Hitmigo</h1>
    <p>Публикувай безплатно. Намери всичко.</p>
  </header>
  <main>
    <section class="hero">
      <h2>Безплатни обяви в България</h2>
      <input placeholder="Какво търсиш?">
      <button>Търси</button>
    </section>
    <section class="categories">
      <div class="category">🚗 Автомобили</div>
      <div class="category">🏠 Имоти</div>
      <div class="category">📱 Техника</div>
      <div class="category">👕 Мода</div>
      <div class="category">🛋️ За дома</div>
      <div class="category">💼 Работа</div>
      <div class="category">🔧 Услуги</div>
    </section>
  </main>
</body>

</html>
