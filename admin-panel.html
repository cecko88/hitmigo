<!doctype html>
<html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hitmigo · Администрация (защитена чернова)</title>
<style>body{margin:0;background:#f3f6fb;color:#1b2b40;font:16px Arial,sans-serif}header{background:#1565c0;color:#fff;padding:18px}main{max-width:900px;margin:auto;padding:16px}section{background:#fff;border-radius:12px;padding:18px;margin:15px 0}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #abc;border-radius:8px;font-size:16px}.row{padding:12px 0;border-bottom:1px solid #ddd}.muted{color:#566}button{padding:10px;border:0;border-radius:8px;background:#1565c0;color:white;cursor:pointer}</style></head>
<body><header><h1>Hitmigo · Административен панел</h1></header><main>
<section><p id="status" role="status">Проверка на достъпа…</p><p class="muted">Защитена чернова: само преглед. Не може да одобрява, скрива или изтрива обяви. За пълна функционалност първо са необходими администраторска роля и RLS правила в Supabase.</p><button id="retry" type="button">Провери отново</button></section>
<section id="panel" hidden><label for="search"><strong>Бързо търсене по заглавие</strong></label><input id="search" type="search" placeholder="Например: велосипед"><p id="count" class="muted"></p><div id="ads"></div></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="hitmigo-auth.js"></script><script>
"use strict";
const statusEl=document.getElementById("status"),panel=document.getElementById("panel"),adsEl=document.getElementById("ads"),search=document.getElementById("search");let ads=[];
function render(){const term=search.value.trim().toLocaleLowerCase("bg");const filtered=ads.filter(a=>String(a.title||"").toLocaleLowerCase("bg").includes(term));adsEl.replaceChildren();document.getElementById("count").textContent=filtered.length+" обяви (максимум 100)";for(const a of filtered){const row=document.createElement("div");row.className="row";const title=document.createElement("strong");title.textContent=a.title||"Без заглавие";const detail=document.createElement("p");detail.className="muted";detail.textContent=(a.city||"")+" · "+(a.category||"");row.append(title,detail);adsEl.append(row)}if(!filtered.length)adsEl.textContent="Няма обяви."}
async function init(){panel.hidden=true;statusEl.textContent="Проверка на достъпа…";try{if(typeof db==="undefined")throw Error("Supabase не е зареден.");const {data:{user},error:authError}=await db.auth.getUser();if(authError||!user)throw Error("Влез първо в профила си от основния сайт.");const {data:allowed,error:roleError}=await db.rpc("is_hitmigo_admin");if(roleError)throw Error("Администраторската проверка още не е настроена в Supabase.");if(allowed!==true)throw Error("Този профил няма администраторски права.");const {data,error}=await db.from("ads").select("id,title,city,category").order("created_at",{ascending:false}).limit(100);if(error)throw error;ads=data||[];panel.hidden=false;statusEl.textContent="Достъпът е потвърден. Режим само за преглед.";render()}catch(err){statusEl.textContent=err.message||"Неуспешна проверка."}}
search.addEventListener("input",render);document.getElementById("retry").addEventListener("click",init);init();
</script></body></html>
